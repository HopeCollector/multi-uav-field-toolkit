[project]
name = "multi-uav-field-toolkit"
version = "0.1.0"
description = "Public-safe tools for multi-UAV monitoring, offline review, and synthetic tuning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HopeCollector" }]
dependencies = []

[project.optional-dependencies]
data = [
  "numpy>=2",
  "pillow>=10",
  "rosbags>=0.11.1",
]

[project.scripts]
multi-uav-monitor = "multi_uav_field_toolkit.monitor.host.server:main"
multi-uav-monitor-mock = "multi_uav_field_toolkit.monitor.mock_sender:main"
multi-uav-tune = "multi_uav_field_toolkit.tuning.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_uav_field_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
